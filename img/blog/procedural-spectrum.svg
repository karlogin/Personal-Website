<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.7"/>
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="280" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="280" fill="url(#dots)"/>

  <!-- Spectrum bar -->
  <rect x="80" y="118" width="740" height="14" rx="7" fill="url(#spectrum)"/>
  <!-- End markers -->
  <circle cx="80" cy="125" r="8" fill="#7c3aed" opacity="0.8"/>
  <circle cx="820" cy="125" r="8" fill="#059669" opacity="0.8"/>

  <!-- End labels -->
  <text x="80" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Fully Authored</text>
  <text x="820" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">Fully Generated</text>

  <!-- Example markers on spectrum -->
  <!-- Hades ~20% -->
  <line x1="228" y1="107" x2="228" y2="132" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="228" cy="125" r="5" fill="#f59e0b" opacity="0.8"/>
  <text x="228" y="97" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Hades</text>
  <text x="228" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Authored rooms,</text>
  <text x="228" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">varied encounters</text>

  <!-- Spelunky ~40% -->
  <line x1="376" y1="107" x2="376" y2="132" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <circle cx="376" cy="125" r="5" fill="#38bdf8" opacity="0.8"/>
  <text x="376" y="97" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">Spelunky</text>
  <text x="376" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Authored tiles,</text>
  <text x="376" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">generated rooms</text>

  <!-- Minecraft ~65% -->
  <line x1="562" y1="107" x2="562" y2="132" stroke="#a78bfa" stroke-width="1.5" opacity="0.7"/>
  <circle cx="562" cy="125" r="5" fill="#a78bfa" opacity="0.8"/>
  <text x="562" y="97" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Minecraft</text>
  <text x="562" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Authored biomes,</text>
  <text x="562" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">generated terrain</text>

  <!-- No Man's Sky ~85% -->
  <line x1="709" y1="107" x2="709" y2="132" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <circle cx="709" cy="125" r="5" fill="#34d399" opacity="0.8"/>
  <text x="709" y="97" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">No Man's Sky</text>
  <text x="709" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Authored rules,</text>
  <text x="709" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">generated everything</text>

  <!-- Bottom label -->
  <text x="80" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#7c3aed" opacity="0.7">← Designer controls quality</text>
  <text x="820" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#059669" opacity="0.7" text-anchor="end">Replayability increases →</text>

  <text x="450" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#374151" text-anchor="middle">Most shipped games live in the middle — authored at one granularity, generated at another.</text>
</svg>

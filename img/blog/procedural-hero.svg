<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020b06"/>
      <stop offset="100%" style="stop-color:#060f0a"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="40%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>

  <!-- Procedural dungeon map grid -->
  <!-- Cell size 40x40, grid starts at 100,65 -->
  <!-- Rooms and corridors rendered as filled/empty cells -->
  <g opacity="0.9">
    <!-- Room A (top-left cluster) -->
    <rect x="100" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="140" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="180" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="100" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="140" y="105" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="180" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="100" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="140" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="180" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <!-- Corridor connecting A to B -->
    <rect x="220" y="105" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="260" y="105" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>

    <!-- Room B (center-top) -->
    <rect x="300" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="420" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="105" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="380" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="420" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="420" y="145" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>

    <!-- Vertical corridor B to D -->
    <rect x="340" y="185" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="340" y="225" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>

    <!-- Room C (right side) -->
    <rect x="540" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="580" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="620" y="65" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="540" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="580" y="105" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="620" y="105" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="460" y="105" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="500" y="105" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>

    <!-- Room D (center, large) -->
    <rect x="260" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="420" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="260" y="305" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="305" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="340" y="305" width="40" height="40" fill="#065f46" stroke="#34d399" stroke-width="1" opacity="0.8"/>
    <rect x="380" y="305" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="420" y="305" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="260" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="420" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>

    <!-- More rooms to the right -->
    <rect x="620" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="660" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="700" y="265" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="620" y="305" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="660" y="305" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="700" y="305" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="620" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="660" y="345" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>

    <!-- Corridor connecting D to right room -->
    <rect x="460" y="305" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="500" y="305" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="540" y="305" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="580" y="305" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>

    <!-- Bottom room -->
    <rect x="300" y="425" width="40" height="40" fill="#052e16" stroke="#047857" stroke-width="0.5" opacity="0.7"/>
    <rect x="300" y="465" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="465" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="465" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="505" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <rect x="340" y="505" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="505" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="300" y="545" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="340" y="545" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <rect x="380" y="545" width="40" height="40" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
  </g>

  <!-- Fade out toward right/bottom using gradient overlays -->
  <rect x="700" y="0" width="500" height="630" fill="url(#bg)" opacity="0.7"/>
  <rect x="0" y="530" width="1200" height="100" fill="url(#bg)" opacity="0.8"/>
  <rect x="0" y="0" width="100" height="630" fill="url(#bg)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="65" fill="url(#bg)" opacity="0.5"/>

  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.7" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
</svg>

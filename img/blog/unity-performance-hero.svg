<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#030a04"/>
      <stop offset="100%" style="stop-color:#0a0a03"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="25%" cy="55%" r="45%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="50%" cy="75%" r="30%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>

  <!-- Circuit board traces -->
  <g stroke="#d97706" stroke-width="1" opacity="0.18" fill="none">
    <path d="M0,200 L200,200 L200,150 L400,150 L400,200 L600,200"/>
    <path d="M600,200 L800,200 L800,250 L1000,250 L1000,200 L1200,200"/>
    <path d="M0,400 L150,400 L150,350 L350,350 L350,400 L550,400 L550,320 L750,320 L750,400 L1200,400"/>
    <path d="M100,0 L100,150 L200,150"/>
    <path d="M400,0 L400,100 L450,100 L450,150"/>
    <path d="M700,0 L700,200"/>
    <path d="M950,0 L950,130 L1000,130 L1000,250"/>
    <path d="M200,630 L200,500 L300,500 L300,400"/>
    <path d="M600,630 L600,480 L550,480 L550,400"/>
    <path d="M900,630 L900,480 L1000,480 L1000,400"/>
    <!-- Horizontal mid traces -->
    <path d="M0,315 L100,315 L100,300 L300,300 L300,315 L500,315 L500,280 L700,280 L700,315 L900,315 L900,300 L1100,300 L1100,315 L1200,315"/>
  </g>

  <!-- Circuit nodes (solder points) -->
  <g fill="#f59e0b" opacity="0.5">
    <circle cx="200" cy="200" r="4"/>
    <circle cx="400" cy="150" r="4"/>
    <circle cx="400" cy="200" r="3"/>
    <circle cx="800" cy="250" r="4"/>
    <circle cx="1000" cy="200" r="3"/>
    <circle cx="150" cy="400" r="3"/>
    <circle cx="350" cy="350" r="4"/>
    <circle cx="550" cy="320" r="3"/>
    <circle cx="750" cy="320" r="4"/>
    <circle cx="100" cy="150" r="3"/>
    <circle cx="450" cy="100" r="3"/>
    <circle cx="300" cy="500" r="3"/>
    <circle cx="900" cy="480" r="3"/>
    <circle cx="300" cy="300" r="3"/>
    <circle cx="500" cy="280" r="3"/>
    <circle cx="700" cy="280" r="4"/>
    <circle cx="900" cy="300" r="3"/>
    <circle cx="1100" cy="300" r="3"/>
  </g>

  <!-- Performance graph (main visual centerpiece) -->
  <g opacity="0.7">
    <!-- Graph baseline -->
    <line x1="160" y1="480" x2="1040" y2="480" stroke="#374151" stroke-width="1.5"/>
    <!-- Normal performance line (green/amber) -->
    <polyline points="160,420 220,418 280,422 340,419 400,421 460,418 520,420 580,419 640,422" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7"/>
    <!-- GC spike -->
    <polyline points="640,422 660,480 680,350 700,480 720,422" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
    <!-- Back to normal -->
    <polyline points="720,422 780,419 840,421 900,418 960,422 1020,420 1040,421" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7"/>
    <!-- Spike fill -->
    <polygon points="660,480 680,350 700,480" fill="#ef4444" opacity="0.15"/>
    <!-- 60fps line -->
    <line x1="160" y1="420" x2="1040" y2="420" stroke="#f59e0b" stroke-width="1" opacity="0.3" stroke-dasharray="6 4"/>
  </g>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.7" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <linearGradient id="frame-good" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="frame-spike" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="300" fill="url(#dots)"/>

  <!-- Axis -->
  <line x1="80" y1="220" x2="860" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="220" stroke="#374151" stroke-width="1.5"/>

  <!-- 60fps target line -->
  <line x1="80" y1="153" x2="860" y2="153" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="868" y="157" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#f59e0b" opacity="0.7">60fps</text>

  <!-- Y axis label -->
  <text x="32" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" transform="rotate(-90,32,145)">Frame time (ms)</text>
  <!-- X axis label -->
  <text x="470" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Time →</text>

  <!-- Frame bars (normal) - 16 bars before spike -->
  <g fill="url(#frame-good)">
    <rect x="95" y="140" width="18" height="80"/>
    <rect x="120" y="138" width="18" height="82"/>
    <rect x="145" y="141" width="18" height="79"/>
    <rect x="170" y="139" width="18" height="81"/>
    <rect x="195" y="140" width="18" height="80"/>
    <rect x="220" y="138" width="18" height="82"/>
    <rect x="245" y="141" width="18" height="79"/>
    <rect x="270" y="139" width="18" height="81"/>
    <rect x="295" y="140" width="18" height="80"/>
    <rect x="320" y="138" width="18" height="82"/>
    <rect x="345" y="141" width="18" height="79"/>
    <rect x="370" y="139" width="18" height="81"/>
    <rect x="395" y="140" width="18" height="80"/>
    <rect x="420" y="142" width="18" height="78"/>
    <rect x="445" y="139" width="18" height="81"/>
    <rect x="470" y="141" width="18" height="79"/>
  </g>

  <!-- GC spike (tall red bar) -->
  <rect x="495" y="72" width="22" height="148" fill="url(#frame-spike)"/>
  <!-- Spike annotation -->
  <line x1="506" y1="68" x2="506" y2="55" stroke="#ef4444" stroke-width="1.2" opacity="0.7"/>
  <text x="506" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">GC pause</text>
  <text x="506" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" opacity="0.7">~14ms</text>

  <!-- Frame bars (normal) - after spike -->
  <g fill="url(#frame-good)">
    <rect x="524" y="140" width="18" height="80"/>
    <rect x="549" y="138" width="18" height="82"/>
    <rect x="574" y="141" width="18" height="79"/>
    <rect x="599" y="139" width="18" height="81"/>
    <rect x="624" y="140" width="18" height="80"/>
    <rect x="649" y="138" width="18" height="82"/>
    <rect x="674" y="141" width="18" height="79"/>
    <rect x="699" y="139" width="18" height="81"/>
    <rect x="724" y="140" width="18" height="80"/>
    <rect x="749" y="142" width="18" height="78"/>
    <rect x="774" y="139" width="18" height="81"/>
    <rect x="799" y="141" width="18" height="79"/>
    <rect x="824" y="140" width="18" height="80"/>
  </g>

  <!-- Legend -->
  <rect x="95" y="266" width="14" height="14" rx="3" fill="#22c55e" opacity="0.7"/>
  <text x="115" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Normal frame (~16ms)</text>
  <rect x="310" y="266" width="14" height="14" rx="3" fill="#ef4444" opacity="0.8"/>
  <text x="330" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">GC collection hitch — invisible source of most mobile hitches</text>
</svg>

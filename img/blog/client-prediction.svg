<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#3b82f6" opacity="0.8"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#f59e0b" opacity="0.8"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="340" fill="url(#dots)"/>

  <!-- Row labels -->
  <text x="32" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Client</text>
  <text x="32" y="242" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#22c55e" text-anchor="middle">Server</text>
  <!-- Divider -->
  <line x1="68" y1="175" x2="880" y2="175" stroke="#1f2937" stroke-width="1.5"/>

  <!-- CLIENT ROW -->
  <!-- Input box -->
  <rect x="80" y="88" width="110" height="52" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="117" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Input</text>
  <text x="135" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Press key</text>

  <!-- Arrow: Input → Predict -->
  <line x1="190" y1="114" x2="250" y2="114" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-blue)"/>

  <!-- Predict box -->
  <rect x="258" y="88" width="130" height="52" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="323" y="117" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Predict</text>
  <text x="323" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Apply locally</text>

  <!-- Arrow: Predict → Local State -->
  <line x1="388" y1="114" x2="448" y2="114" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-blue)"/>

  <!-- Local state box -->
  <rect x="456" y="88" width="140" height="52" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="526" y="117" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">Local State</text>
  <text x="526" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Rendered instantly</text>

  <!-- Arrow: Local State ← Reconcile (from right) -->
  <line x1="718" y1="114" x2="598" y2="114" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-amber)"/>

  <!-- Reconcile box -->
  <rect x="726" y="88" width="148" height="52" rx="12" fill="#1a1200" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="800" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">Reconcile</text>
  <text x="800" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Smooth correction</text>

  <!-- Vertical: Input → Server (send) -->
  <line x1="135" y1="140" x2="135" y2="212" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="155" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#3b82f6" opacity="0.6">send input</text>

  <!-- Vertical: Server auth state → Reconcile -->
  <line x1="800" y1="258" x2="800" y2="142" stroke="#22c55e" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="820" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#22c55e" opacity="0.6">authoritative</text>
  <text x="820" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#22c55e" opacity="0.6">state back</text>

  <!-- SERVER ROW -->
  <!-- Receive -->
  <rect x="80" y="214" width="130" height="52" rx="12" fill="#0a1f0c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="145" y="243" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Receive</text>
  <text x="145" y="259" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Input arrives</text>

  <line x1="210" y1="240" x2="270" y2="240" stroke="#22c55e" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-green)"/>

  <!-- Simulate -->
  <rect x="278" y="214" width="130" height="52" rx="12" fill="#0a1f0c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="343" y="243" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Simulate</text>
  <text x="343" y="259" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Authoritative</text>

  <line x1="408" y1="240" x2="490" y2="240" stroke="#22c55e" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-green)"/>

  <!-- Authoritative state -->
  <rect x="498" y="214" width="162" height="52" rx="12" fill="#0a1f0c" stroke="#34d399" stroke-width="1.5"/>
  <text x="579" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">Auth. State</text>
  <text x="579" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Source of truth</text>

  <line x1="660" y1="240" x2="780" y2="240" stroke="#22c55e" stroke-width="1.5" opacity="0.6" marker-end="url(#arr-green)"/>

  <!-- Broadcast -->
  <rect x="716" y="214" width="130" height="52" rx="12" fill="#0a1f0c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="781" y="243" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Broadcast</text>
  <text x="781" y="259" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">All clients</text>

  <!-- Latency annotation -->
  <line x1="135" y1="140" x2="135" y2="213" stroke="none"/>
  <text x="450" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#374151" text-anchor="middle">Client predicts instantly (feels responsive). Server corrects any divergence. Reconciliation blends the diff smoothly.</text>
</svg>

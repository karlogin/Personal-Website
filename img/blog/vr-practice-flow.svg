<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#7c3aed" opacity="0.8"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="260" fill="url(#dots)"/>

  <!-- Phase 1 -->
  <rect x="40" y="60" width="220" height="140" rx="16" fill="#1e0a30" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="40" y="60" width="220" height="44" rx="16" fill="#7c3aed" opacity="0.15"/>
  <rect x="40" y="84" width="220" height="20" fill="#7c3aed" opacity="0.15"/>
  <text x="150" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="middle">Guided Practice</text>
  <text x="150" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Spatial annotations</text>
  <text x="150" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">show correct steps</text>
  <text x="150" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle" opacity="0.8">Full guidance</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="130" x2="330" y2="130" stroke="#7c3aed" stroke-width="2" opacity="0.6" marker-end="url(#arr)"/>

  <!-- Phase 2 -->
  <rect x="340" y="60" width="220" height="140" rx="16" fill="#0c1a2e" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="340" y="60" width="220" height="44" rx="16" fill="#0891b2" opacity="0.12"/>
  <rect x="340" y="84" width="220" height="20" fill="#0891b2" opacity="0.12"/>
  <text x="450" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="middle">Decreasing Hints</text>
  <text x="450" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Support fades with</text>
  <text x="450" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">each repetition</text>
  <text x="450" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#0891b2" text-anchor="middle" opacity="0.8">Building confidence</text>

  <!-- Arrow 2 -->
  <line x1="560" y1="130" x2="630" y2="130" stroke="#7c3aed" stroke-width="2" opacity="0.6" marker-end="url(#arr)"/>

  <!-- Phase 3 -->
  <rect x="640" y="60" width="220" height="140" rx="16" fill="#0a1f0c" stroke="#059669" stroke-width="1.5"/>
  <rect x="640" y="60" width="220" height="44" rx="16" fill="#059669" opacity="0.12"/>
  <rect x="640" y="84" width="220" height="20" fill="#059669" opacity="0.12"/>
  <text x="750" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">Assessed Practice</text>
  <text x="750" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">No hints. Scored</text>
  <text x="750" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">against criteria</text>
  <text x="750" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#059669" text-anchor="middle" opacity="0.8">Competency verified</text>

  <!-- Caption -->
  <text x="450" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#374151" text-anchor="middle">The pattern that worked: show → fade → assess. Repeated failure in assessments demoralises learners.</text>
</svg>

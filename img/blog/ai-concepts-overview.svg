<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="0.7" fill="#ffffff" opacity="0.045"/>
  </pattern>
  <rect width="1000" height="420" fill="url(#dots)"/>

  <!-- ── Card 1: AI Agent ── -->
  <g filter="url(#card-shadow)">
    <rect x="20" y="28" width="225" height="364" rx="18" fill="#0a0f1e" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>
  <rect x="20" y="28" width="225" height="52" rx="18" fill="#1d4ed8" opacity="0.12"/>
  <rect x="20" y="52" width="225" height="28" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="60" cy="62" r="16" fill="#1e3a8a" opacity="0.5"/>
  <circle cx="60" cy="62" r="10" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="60" cy="62" r="3.5" fill="#60a5fa"/>
  <circle cx="60" cy="45" r="3" fill="#93c5fd" opacity="0.6"/>
  <circle cx="77" cy="62" r="3" fill="#93c5fd" opacity="0.6"/>
  <circle cx="60" cy="79" r="3" fill="#93c5fd" opacity="0.6"/>
  <circle cx="43" cy="62" r="3" fill="#93c5fd" opacity="0.6"/>
  <text x="84" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="#60a5fa">AI Agent</text>
  <line x1="38" y1="93" x2="227" y2="93" stroke="#1e3a8a" stroke-width="1"/>
  <text x="38" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Autonomous reasoning</text>
  <text x="38" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">loop that pursues goals</text>
  <text x="38" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">by calling skills &amp; tools,</text>
  <text x="38" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">adapting as it goes.</text>
  <rect x="38" y="202" width="189" height="26" rx="8" fill="#1e3a8a" opacity="0.5"/>
  <text x="132" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Plan → Act → Observe</text>
  <text x="38" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#3b82f6" opacity="0.8">Autonomous · Adaptive</text>

  <!-- ── Card 2: Skills ── -->
  <g filter="url(#card-shadow)">
    <rect x="265" y="28" width="225" height="364" rx="18" fill="#0a0a1a" stroke="#5b21b6" stroke-width="1.5"/>
  </g>
  <rect x="265" y="28" width="225" height="52" rx="18" fill="#5b21b6" opacity="0.12"/>
  <rect x="265" y="52" width="225" height="28" fill="#5b21b6" opacity="0.12"/>
  <rect x="278" y="45" width="32" height="32" rx="8" fill="#4c1d95" opacity="0.5"/>
  <polygon points="298,47 289,66 297,66 288,80 304,59 296,59" fill="#a78bfa"/>
  <text x="320" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="#a78bfa">Skills</text>
  <line x1="283" y1="93" x2="472" y2="93" stroke="#3b0764" stroke-width="1"/>
  <text x="283" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Named, reusable action</text>
  <text x="283" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">sequences. The agent</text>
  <text x="283" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">calls them by name,</text>
  <text x="283" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">no internals needed.</text>
  <rect x="283" y="206" width="82" height="24" rx="7" fill="#4c1d95" opacity="0.45"/>
  <text x="324" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">/commit</text>
  <rect x="375" y="206" width="93" height="24" rx="7" fill="#4c1d95" opacity="0.45"/>
  <text x="421" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">/deploy</text>
  <rect x="283" y="238" width="82" height="24" rx="7" fill="#4c1d95" opacity="0.45"/>
  <text x="324" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">/review</text>
  <text x="283" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#7c3aed" opacity="0.8">Procedural · Repeatable</text>

  <!-- ── Card 3: MCP ── -->
  <g filter="url(#card-shadow)">
    <rect x="510" y="28" width="225" height="364" rx="18" fill="#040f14" stroke="#0e7490" stroke-width="1.5"/>
  </g>
  <rect x="510" y="28" width="225" height="52" rx="18" fill="#0e7490" opacity="0.12"/>
  <rect x="510" y="52" width="225" height="28" fill="#0e7490" opacity="0.12"/>
  <rect x="523" y="45" width="32" height="32" rx="8" fill="#164e63" opacity="0.5"/>
  <rect x="530" y="51" width="18" height="12" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
  <line x1="534" y1="63" x2="534" y2="72" stroke="#22d3ee" stroke-width="1.8"/>
  <line x1="545" y1="63" x2="545" y2="72" stroke="#22d3ee" stroke-width="1.8"/>
  <rect x="527" y="72" width="24" height="5" rx="2.5" fill="#22d3ee" opacity="0.7"/>
  <text x="565" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="#22d3ee">MCP</text>
  <line x1="528" y1="93" x2="717" y2="93" stroke="#164e63" stroke-width="1"/>
  <text x="528" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Standardized protocol</text>
  <text x="528" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">connecting AI to any</text>
  <text x="528" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">external tool: filesystem,</text>
  <text x="528" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">APIs, databases.</text>
  <text x="528" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6b7280">One protocol → any tool</text>
  <text x="528" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#0891b2" opacity="0.8">Integration · Extensible</text>

  <!-- ── Card 4: Context Docs ── -->
  <g filter="url(#card-shadow)">
    <rect x="755" y="28" width="225" height="364" rx="18" fill="#030f09" stroke="#065f46" stroke-width="1.5"/>
  </g>
  <rect x="755" y="28" width="225" height="52" rx="18" fill="#065f46" opacity="0.12"/>
  <rect x="755" y="52" width="225" height="28" fill="#065f46" opacity="0.12"/>
  <rect x="768" y="45" width="32" height="32" rx="8" fill="#064e3b" opacity="0.5"/>
  <rect x="775" y="51" width="18" height="22" rx="2.5" fill="none" stroke="#34d399" stroke-width="1.8"/>
  <line x1="779" y1="58" x2="789" y2="58" stroke="#34d399" stroke-width="1.4"/>
  <line x1="779" y1="64" x2="789" y2="64" stroke="#34d399" stroke-width="1.4"/>
  <line x1="779" y1="70" x2="785" y2="70" stroke="#34d399" stroke-width="1.4"/>
  <text x="810" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="#34d399">Context Docs</text>
  <line x1="773" y1="93" x2="962" y2="93" stroke="#064e3b" stroke-width="1"/>
  <text x="773" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Static knowledge the AI</text>
  <text x="773" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">carries into every task.</text>
  <text x="773" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Project rules, patterns,</text>
  <text x="773" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">architecture, domain</text>
  <text x="773" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">knowledge.</text>
  <text x="773" y="232" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6b7280">e.g. CLAUDE.md</text>
  <text x="773" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#059669" opacity="0.8">Passive · Foundational</text>
</svg>

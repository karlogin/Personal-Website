<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03050a"/>
      <stop offset="60%" style="stop-color:#080c18"/>
      <stop offset="100%" style="stop-color:#050810"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="30%" cy="40%" r="45%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="72%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="55%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="node-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="node-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="node-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="node-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </radialGradient>
    <filter id="blur-node">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>

  <!-- Fine dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.75" fill="#ffffff" opacity="0.055"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ── Connection lines (drawn before nodes so nodes sit on top) ── -->
  <g fill="none" stroke-linecap="round">
    <!-- center hub to outer nodes -->
    <line x1="600" y1="315" x2="310" y2="175" stroke="#3b82f6" stroke-width="1.2" opacity="0.35"/>
    <line x1="600" y1="315" x2="890" y2="175" stroke="#7c3aed" stroke-width="1.2" opacity="0.3"/>
    <line x1="600" y1="315" x2="920" y2="400" stroke="#0891b2" stroke-width="1.2" opacity="0.3"/>
    <line x1="600" y1="315" x2="280" y2="430" stroke="#059669" stroke-width="1.2" opacity="0.3"/>
    <line x1="600" y1="315" x2="480" y2="500" stroke="#059669" stroke-width="1" opacity="0.2"/>
    <line x1="600" y1="315" x2="740" y2="490" stroke="#0891b2" stroke-width="1" opacity="0.2"/>
    <line x1="600" y1="315" x2="160" y2="290" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
    <line x1="600" y1="315" x2="1040" y2="280" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <!-- cross connections between outer nodes -->
    <line x1="310" y1="175" x2="890" y2="175" stroke="#6366f1" stroke-width="0.8" opacity="0.18"/>
    <line x1="310" y1="175" x2="280" y2="430" stroke="#3b82f6" stroke-width="0.8" opacity="0.2"/>
    <line x1="890" y1="175" x2="920" y2="400" stroke="#7c3aed" stroke-width="0.8" opacity="0.18"/>
    <line x1="280" y1="430" x2="480" y2="500" stroke="#059669" stroke-width="0.8" opacity="0.2"/>
    <line x1="920" y1="400" x2="740" y2="490" stroke="#0891b2" stroke-width="0.8" opacity="0.18"/>
    <line x1="160" y1="290" x2="310" y2="175" stroke="#3b82f6" stroke-width="0.7" opacity="0.15"/>
    <line x1="1040" y1="280" x2="890" y2="175" stroke="#7c3aed" stroke-width="0.7" opacity="0.15"/>
    <line x1="480" y1="500" x2="740" y2="490" stroke="#0891b2" stroke-width="0.7" opacity="0.15"/>
    <!-- tertiary distant nodes -->
    <line x1="160" y1="290" x2="95" y2="160" stroke="#3b82f6" stroke-width="0.7" opacity="0.14"/>
    <line x1="160" y1="290" x2="130" y2="450" stroke="#059669" stroke-width="0.7" opacity="0.12"/>
    <line x1="1040" y1="280" x2="1100" y2="140" stroke="#7c3aed" stroke-width="0.7" opacity="0.14"/>
    <line x1="1040" y1="280" x2="1090" y2="430" stroke="#0891b2" stroke-width="0.7" opacity="0.12"/>
    <line x1="310" y1="175" x2="430" y2="80" stroke="#6366f1" stroke-width="0.7" opacity="0.14"/>
    <line x1="890" y1="175" x2="780" y2="75" stroke="#7c3aed" stroke-width="0.7" opacity="0.12"/>
    <line x1="480" y1="500" x2="380" y2="575" stroke="#059669" stroke-width="0.7" opacity="0.12"/>
    <line x1="740" y1="490" x2="840" y2="565" stroke="#0891b2" stroke-width="0.7" opacity="0.12"/>
  </g>

  <!-- ── Glow halos (blurred circles behind main nodes) ── -->
  <circle cx="600" cy="315" r="48" fill="#2563eb" opacity="0.12" filter="url(#blur-sm)"/>
  <circle cx="310" cy="175" r="28" fill="#7c3aed" opacity="0.15" filter="url(#blur-sm)"/>
  <circle cx="890" cy="175" r="28" fill="#7c3aed" opacity="0.12" filter="url(#blur-sm)"/>
  <circle cx="920" cy="400" r="24" fill="#0891b2" opacity="0.15" filter="url(#blur-sm)"/>
  <circle cx="280" cy="430" r="24" fill="#059669" opacity="0.15" filter="url(#blur-sm)"/>

  <!-- ── Main nodes ── -->
  <!-- Center hub: Agent -->
  <circle cx="600" cy="315" r="22" fill="url(#node-blue)" opacity="0.95"/>
  <circle cx="600" cy="315" r="30" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="315" r="40" fill="none" stroke="#3b82f6" stroke-width="0.7" opacity="0.15"/>

  <!-- Top left: Skills -->
  <circle cx="310" cy="175" r="14" fill="url(#node-purple)" opacity="0.95"/>
  <circle cx="310" cy="175" r="20" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>

  <!-- Top right: more Skills / another concept -->
  <circle cx="890" cy="175" r="14" fill="url(#node-purple)" opacity="0.9"/>
  <circle cx="890" cy="175" r="20" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.25"/>

  <!-- Right: MCP -->
  <circle cx="920" cy="400" r="12" fill="url(#node-cyan)" opacity="0.9"/>
  <circle cx="920" cy="400" r="18" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.25"/>

  <!-- Left: Context -->
  <circle cx="280" cy="430" r="12" fill="url(#node-green)" opacity="0.9"/>
  <circle cx="280" cy="430" r="18" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.25"/>

  <!-- Secondary nodes -->
  <circle cx="160" cy="290" r="8" fill="#3b82f6" opacity="0.7"/>
  <circle cx="1040" cy="280" r="8" fill="#7c3aed" opacity="0.65"/>
  <circle cx="480" cy="500" r="8" fill="#34d399" opacity="0.65"/>
  <circle cx="740" cy="490" r="8" fill="#22d3ee" opacity="0.65"/>

  <!-- Tertiary nodes (tiny) -->
  <circle cx="95" cy="160" r="4.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="130" cy="450" r="4.5" fill="#34d399" opacity="0.45"/>
  <circle cx="1100" cy="140" r="4.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="1090" cy="430" r="4.5" fill="#22d3ee" opacity="0.45"/>
  <circle cx="430" cy="80" r="4" fill="#818cf8" opacity="0.4"/>
  <circle cx="780" cy="75" r="4" fill="#a78bfa" opacity="0.4"/>
  <circle cx="380" cy="575" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="840" cy="565" r="4" fill="#22d3ee" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="300" fill="url(#dots)"/>

  <!-- LEFT CHART: Digital (bad) -->
  <text x="215" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">Digital Input</text>
  <text x="215" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Instant start · Instant stop</text>
  <!-- Axes -->
  <line x1="80" y1="220" x2="360" y2="220" stroke="#374151" stroke-width="1.2"/>
  <line x1="80" y1="80" x2="80" y2="220" stroke="#374151" stroke-width="1.2"/>
  <text x="72" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Speed</text>
  <text x="360" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280">Time</text>
  <!-- Digital velocity curve (sharp square wave) -->
  <polyline points="80,220 120,220 120,100 240,100 240,220 360,220" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
  <!-- Key pressed / released markers -->
  <line x1="120" y1="220" x2="120" y2="240" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <text x="120" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key down</text>
  <line x1="240" y1="220" x2="240" y2="240" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <text x="240" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key up</text>
  <!-- Label: feels weightless -->
  <text x="180" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#ef4444" text-anchor="middle" opacity="0.7">feels weightless</text>

  <!-- Divider -->
  <line x1="450" y1="60" x2="450" y2="270" stroke="#1f2937" stroke-width="1.5"/>

  <!-- RIGHT CHART: Physical (good) -->
  <text x="680" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">Physical Input</text>
  <text x="680" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Acceleration · Deceleration</text>
  <!-- Axes -->
  <line x1="545" y1="220" x2="830" y2="220" stroke="#374151" stroke-width="1.2"/>
  <line x1="545" y1="80" x2="545" y2="220" stroke="#374151" stroke-width="1.2"/>
  <text x="537" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Speed</text>
  <text x="830" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280">Time</text>
  <!-- Physical velocity curve (smooth ease in/out) -->
  <path d="M545,220 C575,220 585,105 620,100 L700,100 C735,100 745,220 780,220 L830,220" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.8"/>
  <!-- Key pressed / released markers -->
  <line x1="585" y1="220" x2="585" y2="240" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <text x="585" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key down</text>
  <line x1="745" y1="220" x2="745" y2="240" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <text x="745" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key up</text>
  <!-- Accel label -->
  <text x="600" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#22c55e" text-anchor="middle" opacity="0.7">accel</text>
  <text x="760" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#22c55e" text-anchor="middle" opacity="0.7">decel</text>
  <text x="680" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#22c55e" text-anchor="middle" opacity="0.7">has weight &amp; inertia</text>

  <!-- Caption -->
  <text x="450" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#374151" text-anchor="middle">The difference is subtle to describe but immediately felt. Acceleration curves are the most impactful single tweak.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030710"/>
      <stop offset="100%" style="stop-color:#050c18"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="20%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="50%" cy="45%" r="30%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="80%" cy="55%" r="40%">
      <stop offset="0%" style="stop-color:#0e7490;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <filter id="node-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>

  <!-- Connection lines between nodes -->
  <g stroke="#0ea5e9" fill="none" opacity="0.3">
    <!-- Server hub to clients -->
    <line x1="600" y1="315" x2="160" y2="180" stroke-width="1.5"/>
    <line x1="600" y1="315" x2="160" y2="450" stroke-width="1.5"/>
    <line x1="600" y1="315" x2="1040" y2="180" stroke-width="1.5"/>
    <line x1="600" y1="315" x2="1040" y2="450" stroke-width="1.5"/>
    <line x1="600" y1="315" x2="600" y2="100" stroke-width="1.5"/>
    <line x1="600" y1="315" x2="300" y2="315" stroke-width="1.2" opacity="0.2"/>
    <line x1="600" y1="315" x2="900" y2="315" stroke-width="1.2" opacity="0.2"/>
    <!-- Client to client (peer routes) -->
    <line x1="160" y1="180" x2="160" y2="450" stroke-width="0.8" opacity="0.6" stroke-dasharray="4 4"/>
    <line x1="1040" y1="180" x2="1040" y2="450" stroke-width="0.8" opacity="0.6" stroke-dasharray="4 4"/>
    <line x1="160" y1="180" x2="600" y2="100" stroke-width="0.8" opacity="0.6" stroke-dasharray="3 4"/>
    <line x1="1040" y1="180" x2="600" y2="100" stroke-width="0.8" opacity="0.6" stroke-dasharray="3 4"/>
    <line x1="160" y1="450" x2="300" y2="540" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 4"/>
    <line x1="1040" y1="450" x2="900" y2="540" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 4"/>
  </g>

  <!-- Data packets traveling along lines (small circles) -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="380" cy="247" r="3.5"/>
    <circle cx="820" cy="247" r="3.5"/>
    <circle cx="600" cy="207" r="3.5"/>
    <circle cx="480" cy="315" r="3" opacity="0.4"/>
    <circle cx="720" cy="315" r="3" opacity="0.4"/>
    <circle cx="232" cy="352" r="3"/>
    <circle cx="968" cy="352" r="3"/>
  </g>

  <!-- Server node (center, larger) -->
  <circle cx="600" cy="315" r="36" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="600" cy="315" r="48" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.35"/>
  <circle cx="600" cy="315" r="62" fill="none" stroke="#075985" stroke-width="0.7" opacity="0.2"/>
  <!-- Server icon: stack of layers -->
  <rect x="584" y="300" width="32" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="584" y="312" width="32" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
  <rect x="584" y="324" width="32" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>

  <!-- Client nodes -->
  <g filter="url(#node-glow)">
    <circle cx="160" cy="180" r="22" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="160" cy="450" r="22" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="22" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="1040" cy="450" r="22" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="600" cy="100" r="18" fill="#0c1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  </g>
  <!-- Controller icon in client nodes -->
  <rect x="148" y="173" width="24" height="14" rx="7" fill="#38bdf8" opacity="0.5"/>
  <rect x="148" y="443" width="24" height="14" rx="7" fill="#38bdf8" opacity="0.5"/>
  <rect x="1028" y="173" width="24" height="14" rx="7" fill="#38bdf8" opacity="0.5"/>
  <rect x="1028" y="443" width="24" height="14" rx="7" fill="#38bdf8" opacity="0.5"/>

  <!-- Smaller distant nodes -->
  <circle cx="300" cy="540" r="12" fill="#0c1a2e" stroke="#0369a1" stroke-width="1" opacity="0.7"/>
  <circle cx="900" cy="540" r="12" fill="#0c1a2e" stroke="#0369a1" stroke-width="1" opacity="0.7"/>
  <circle cx="80" cy="315" r="9" fill="#0c1a2e" stroke="#0369a1" stroke-width="1" opacity="0.5"/>
  <circle cx="1120" cy="315" r="9" fill="#0c1a2e" stroke="#0369a1" stroke-width="1" opacity="0.5"/>

  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.7" fill="#fff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
</svg>

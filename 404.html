    <style>
        .ap-404-section {
            background: #000;
            color: #f5f5f7;
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ap-404-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            text-align: center;
        }
        .ap-404-code {
            font-size: clamp(96px, 20vw, 200px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(160deg, #f5f5f7 30%, #6e6e73 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(36px);
            animation: title-rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }
        .ap-404-title {
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 600;
            color: #f5f5f7;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: title-rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }
        .ap-404-sub {
            font-size: 17px;
            color: #6e6e73;
            margin-bottom: 48px;
            opacity: 0;
            transform: translateY(20px);
            animation: title-rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
        }
        .ap-404-btn {
            display: inline-block;
            font-size: 17px;
            font-weight: 400;
            color: #f5f5f7;
            text-decoration: none;
            opacity: 0;
            animation: title-rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
            transition: opacity 0.2s ease;
        }
        .ap-404-btn:hover {
            opacity: 0.7;
        }
        @keyframes title-rise {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<!-- ── Nav ──────────────────────────────────────────────────── -->
<nav class="ap-nav" id="ap-nav"></nav>

<!-- ── 404 ───────────────────────────────────────────────────── -->
<section class="ap-404-section">
    <div class="ap-404-inner">
        <div class="ap-404-code">404</div>
        <h1 class="ap-404-title">Page not found</h1>
        <p class="ap-404-sub">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="ap-404-btn">Back to home</a>
    </div>
</section>

<!-- ── Footer ───────────────────────────────────────────────── -->
<footer class="ap-footer" id="ap-footer"></footer>

<script src="js/layout.js"></script>

</body>

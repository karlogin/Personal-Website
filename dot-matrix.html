<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Matrix</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --accent: #e0ff4f;
    --font: 'Courier New', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    width: 100%;
    max-width: 900px;
  }

  h1 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: normal;
  }

  .version {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    width: 100%;
    max-width: 900px;
    border: 1px solid var(--border);
    background: var(--border);
  }

  .ctrl {
    background: var(--surface);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ctrl label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 0;
    cursor: pointer;
  }

  .ctrl-val {
    font-size: 11px;
    color: var(--accent);
    min-width: 28px;
    text-align: right;
  }

  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: var(--font);
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
    outline: none;
    width: 100%;
  }

  select:focus { border-color: var(--accent); }

  .upload-area {
    width: 100%;
    max-width: 900px;
    border: 1px dashed var(--border);
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
  }

  .upload-area:hover, .upload-area.drag { border-color: var(--accent); }

  .upload-area input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
  }

  .upload-label span {
    color: var(--accent);
  }

  .canvas-wrap {
    width: 100%;
    max-width: 900px;
    position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#output {
    display: block;
    max-width: 100%;
  }

  .placeholder {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  #srcCanvas { display: none; }

  .status-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }

  .status-bar span { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>dot matrix</h1>
  <div class="version">v1.0 — image converter</div>
</header>

<div class="controls">
  <div class="ctrl">
    <label>dot size</label>
    <div class="ctrl-row">
      <input type="range" id="dotSize" min="2" max="20" value="6" step="1">
      <div class="ctrl-val" id="dotSizeVal">6</div>
    </div>
  </div>
  <div class="ctrl">
    <label>gap</label>
    <div class="ctrl-row">
      <input type="range" id="gap" min="0" max="8" value="2" step="1">
      <div class="ctrl-val" id="gapVal">2</div>
    </div>
  </div>
  <div class="ctrl">
    <label>amplitude</label>
    <div class="ctrl-row">
      <input type="range" id="amp" min="0" max="20" value="6" step="1">
      <div class="ctrl-val" id="ampVal">6</div>
    </div>
  </div>
  <div class="ctrl">
    <label>speed</label>
    <div class="ctrl-row">
      <input type="range" id="speed" min="0.1" max="4" value="1" step="0.1">
      <div class="ctrl-val" id="speedVal">1.0</div>
    </div>
  </div>
  <div class="ctrl">
    <label>animation</label>
    <select id="mode">
      <option value="wave">wave</option>
      <option value="ripple">ripple</option>
      <option value="scan">scanline</option>
      <option value="breathe">breathe</option>
      <option value="noise">noise</option>
      <option value="none">static</option>
    </select>
  </div>
  <div class="ctrl">
    <label>color mode</label>
    <select id="colorMode">
      <option value="color">color</option>
      <option value="gray">grayscale</option>
      <option value="mono">monochrome</option>
      <option value="invert">inverted</option>
    </select>
  </div>
</div>

<div class="upload-area" id="uploadArea">
  <input type="file" id="fileInput" accept="image/*">
  <div class="upload-label">drop image here or <span>browse</span></div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <div class="placeholder" id="placeholder">awaiting image</div>
  <canvas id="output"></canvas>
</div>

<canvas id="srcCanvas"></canvas>

<div class="status-bar">
  <div>dots: <span id="dotCount">—</span></div>
  <div>grid: <span id="gridSize">—</span></div>
  <div>mode: <span id="modeStatus">—</span></div>
  <div>fps: <span id="fpsStatus">—</span></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const srcCanvas = document.getElementById('srcCanvas');
const output = document.getElementById('output');
const ctx = output.getContext('2d');
const srcCtx = srcCanvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const uploadArea = document.getElementById('uploadArea');

let dots = [];
let animId = null;
let imgLoaded = false;
let imgW = 0, imgH = 0;
let imgData = null;
let t = 0;
let lastTs = 0;
let fpsArr = [];

const params = {
  dotSize: 6,
  gap: 2,
  amp: 6,
  speed: 1,
  mode: 'wave',
  colorMode: 'color'
};

function bindSlider(id, key, valId, fmt) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener('input', () => {
    params[key] = parseFloat(el.value);
    valEl.textContent = fmt ? parseFloat(el.value).toFixed(1) : el.value;
    if (imgLoaded) buildDots();
  });
}

bindSlider('dotSize', 'dotSize', 'dotSizeVal', false);
bindSlider('gap', 'gap', 'gapVal', false);
bindSlider('amp', 'amp', 'ampVal', false);
bindSlider('speed', 'speed', 'speedVal', true);

document.getElementById('mode').addEventListener('change', e => {
  params.mode = e.target.value;
  document.getElementById('modeStatus').textContent = e.target.value;
});

document.getElementById('colorMode').addEventListener('change', e => {
  params.colorMode = e.target.value;
  if (imgLoaded) buildDots();
});

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadImage(f);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) loadImage(fileInput.files[0]);
});

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    imgW = img.width;
    imgH = img.height;
    srcCanvas.width = imgW;
    srcCanvas.height = imgH;
    srcCtx.drawImage(img, 0, 0);
    imgData = srcCtx.getImageData(0, 0, imgW, imgH);
    URL.revokeObjectURL(url);
    imgLoaded = true;
    placeholder.style.display = 'none';
    buildDots();
  };
  img.src = url;
}

function sampleColor(px, py) {
  const ix = Math.min(imgW - 1, Math.max(0, Math.round(px)));
  const iy = Math.min(imgH - 1, Math.max(0, Math.round(py)));
  const i = (iy * imgW + ix) * 4;
  let r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
  const a = imgData.data[i+3];

  if (params.colorMode === 'gray') {
    const lum = 0.299*r + 0.587*g + 0.114*b;
    r = g = b = lum;
  } else if (params.colorMode === 'mono') {
    const lum = 0.299*r + 0.587*g + 0.114*b;
    r = g = b = lum > 128 ? 224 : 30;
  } else if (params.colorMode === 'invert') {
    r = 255 - r; g = 255 - g; b = 255 - b;
  }

  return { r, g, b, a: a / 255 };
}

function buildDots() {
  const step = params.dotSize + params.gap;
  const maxW = 880;
  const aspect = imgH / imgW;
  const canvasW = Math.min(imgW, maxW);
  const canvasH = Math.round(canvasW * aspect);
  output.width = canvasW;
  output.height = canvasH;

  const cols = Math.floor(canvasW / step);
  const rows = Math.floor(canvasH / step);
  const offX = (canvasW - cols * step) / 2;
  const offY = (canvasH - rows * step) / 2;

  dots = [];
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cx = offX + col * step + step / 2;
      const cy = offY + row * step + step / 2;
      const px = (cx / canvasW) * imgW;
      const py = (cy / canvasH) * imgH;
      const color = sampleColor(px, py);
      const lum = 0.299*color.r + 0.587*color.g + 0.114*color.b;
      dots.push({ cx, cy, color, lum, col, row, idx: dots.length });
    }
  }

  document.getElementById('dotCount').textContent = dots.length.toLocaleString();
  document.getElementById('gridSize').textContent = cols + '×' + rows;
  document.getElementById('modeStatus').textContent = params.mode;

  if (animId) cancelAnimationFrame(animId);
  t = 0;
  animate(0);
}

function noise(x, y, t) {
  return Math.sin(x * 0.3 + t) * Math.cos(y * 0.3 + t * 0.7) * 0.5 +
         Math.sin(x * 0.7 + y * 0.4 + t * 1.3) * 0.3 +
         Math.cos(x * 0.15 - y * 0.2 + t * 0.5) * 0.2;
}

function getDotDisplace(dot, t) {
  let dx = 0, dy = 0, scale = 1;
  const amp = params.amp;
  const cx = output.width / 2, cy = output.height / 2;

  if (params.mode === 'wave') {
    const phase = (dot.cx / output.width) * Math.PI * 4 - t * 3;
    dy = Math.sin(phase) * amp;
  } else if (params.mode === 'ripple') {
    const dist = Math.sqrt((dot.cx - cx)**2 + (dot.cy - cy)**2);
    const phase = dist * 0.05 - t * 3;
    const r = Math.sin(phase) * amp;
    const angle = Math.atan2(dot.cy - cy, dot.cx - cx);
    dx = Math.cos(angle) * r;
    dy = Math.sin(angle) * r;
  } else if (params.mode === 'scan') {
    const scanX = ((t * 200 * params.speed) % (output.width + 80)) - 40;
    const dist = Math.abs(dot.cx - scanX);
    if (dist < 30) {
      dy = -Math.sin((dist / 30) * Math.PI) * amp * 2;
      scale = 1 + Math.sin((dist / 30) * Math.PI) * 0.6;
    }
  } else if (params.mode === 'breathe') {
    const s = 1 + Math.sin(t * 2) * (amp / 40);
    dx = (dot.cx - cx) * (s - 1);
    dy = (dot.cy - cy) * (s - 1);
    scale = s;
  } else if (params.mode === 'noise') {
    const n = noise(dot.col * 0.5, dot.row * 0.5, t);
    dx = n * amp;
    dy = noise(dot.col * 0.5 + 100, dot.row * 0.5 + 100, t * 0.8) * amp;
  }

  return { dx, dy, scale };
}

function animate(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  if (ts > 0) t += dt * params.speed;

  fpsArr.push(ts);
  while (fpsArr[0] < ts - 1000) fpsArr.shift();
  if (Math.round(ts / 500) !== Math.round((ts - dt * 1000) / 500)) {
    document.getElementById('fpsStatus').textContent = fpsArr.length;
  }

  ctx.clearRect(0, 0, output.width, output.height);
  const r = params.dotSize / 2;

  for (let i = 0; i < dots.length; i++) {
    const d = dots[i];
    if (d.color.a < 0.05) continue;
    const { dx, dy, scale } = getDotDisplace(d, t);
    const x = d.cx + dx;
    const y = d.cy + dy;
    const rad = r * scale;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.5, rad), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.round(d.color.r)},${Math.round(d.color.g)},${Math.round(d.color.b)},${d.color.a.toFixed(2)})`;
    ctx.fill();
  }

  animId = requestAnimationFrame(animate);
}
</script>
</body>
</html>

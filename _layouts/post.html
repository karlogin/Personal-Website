<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" type="text/css" href="/css/apple.min.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV5T4XKX3P"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FV5T4XKX3P');
    </script>

    <title>{{ page.title }} | Karthik Padmanabhan</title>
    <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>

<nav class="ap-nav" id="ap-nav"></nav>

<article class="ap-post">
    <div class="ap-post-inner">
        <header class="ap-post-header">
            <a href="/blog/" class="ap-post-back">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                All posts
            </a>
            <div class="ap-post-meta">
                <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
                {% if page.tags and page.tags.size > 0 %}
                <span class="ap-post-tags">
                    {% for tag in page.tags %}<span class="ap-post-tag">{{ tag }}</span>{% endfor %}
                </span>
                {% endif %}
            </div>
            <h1 class="ap-post-title">{{ page.title }}</h1>
            {% if page.subtitle %}<p class="ap-post-subtitle">{{ page.subtitle }}</p>{% endif %}
        </header>
        <div class="ap-post-content">
            {{ content }}
        </div>
    </div>
</article>

<footer class="ap-footer" id="ap-footer"></footer>

<script src="/js/layout.js"></script>

</body>
</html>
